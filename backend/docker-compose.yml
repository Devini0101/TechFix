version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: techfix_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: techfix
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data