spring.application.name=techfix

#Config da cnx com db
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:techfix}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#Config do Hibernate do JPA
spring.jpa.hibernate.ddl-auto=none
# spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

# Localização dos scripts de migration
spring.flyway.locations=classpath:db/migration

# Garante que o Flyway criará o schema se necessário
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

api.security.token.secret=${JWT_SECRET:local_dev}

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=${GMAIL:seu_email@gmail.com}
# senha de 16 letras que deve ser gerada para seu email através da aba (Senhas de app) na sua config do google
spring.mail.password=${APPGMAILPASS:abcdefghijklmnop}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true