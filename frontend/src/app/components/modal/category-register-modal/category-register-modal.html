<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl flex flex-col gap-5">

        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
            <div>
                <p class="text-xs font-medium text-blue-400 mb-0.5">Gestão de Inventário</p>
                <h3 class="text-xl font-bold text-white">
                    {{ isEditing() ? 'Editar Categoria' : 'Nova Categoria' }}
                </h3>
            </div>

            <button (click)="closeModal()" class="text-slate-400 hover:text-white transition text-xl cursor-pointer p-1">
                &times;
            </button>
        </div>

        <form (ngSubmit)="saveCategory()" class="flex flex-col gap-5 pt-2">

            <div class="flex flex-col gap-2">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-300">Nome da Categoria <span class="text-rose-500">*</span></label>
                <input
                type="text"
                [(ngModel)]="categoryData.name"
                name="name"
                required
                placeholder="Ex: Notebook Corporativo"
                class="w-full h-11 bg-slate-900 border border-slate-600 rounded-lg px-4 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all"/>
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-300">Código Técnico <span class="text-rose-500">*</span></label>
                <input
                    type="text"
                    [ngModel]="categoryData.code"
                    (ngModelChange)="formatCategoryCode($event)"
                    name="code"
                    required
                    placeholder="Ex: NOTE_01"
                    class="w-full h-11 bg-slate-900 border border-slate-600 rounded-lg px-4 text-sm text-white font-mono uppercase placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all"
                />
            </div>


            <div class="flex items-center gap-3 pt-2">
                <label class="relative flex items-center cursor-pointer">
                    <input type="checkbox" [(ngModel)]="categoryData.active" name="active" class="sr-only peer">
                    <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                </label>
                <span class="text-sm font-semibold text-slate-300 cursor-pointer" (click)="categoryData.active = !categoryData.active">
                    Ativar categoria imediatamente
                </span>
            </div>

            <div class="flex items-center gap-3 pt-4 border-t border-slate-700 mt-2">
                <button
                type="button"
                (click)="closeModal()"
                class="flex-1 px-4 py-3 text-sm font-semibold text-slate-300 border border-slate-600 hover:bg-slate-700 hover:text-white rounded-xl transition cursor-pointer">
                Cancelar
                </button>

                <button
                type="submit"
                class="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold rounded-xl transition shadow-lg shadow-blue-900/20 active:scale-95 cursor-pointer">
                {{ isEditing() ? 'Salvar' : 'Cadastrar' }}
                </button>

            </div>

        </form>
    </div>
</div>
