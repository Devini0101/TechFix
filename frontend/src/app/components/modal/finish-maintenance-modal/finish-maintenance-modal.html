@if (maintenance(); as order) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 px-4 backdrop-blur-sm">
    <div
        class="w-full max-w-lg rounded-2xl border border-slate-700 bg-slate-800 p-6 shadow-2xl"
        role="dialog"
        aria-modal="true"
        aria-labelledby="payment-title"
    >
        <div class="flex justify-between items-center">
            <h2 class="text-lg font-bold">Finalizar manutenção</h2>
            <button (click)="closeModal()" class="hover:cursor-pointer"><i class="fa-solid fa-x"></i></button>
        </div>
        <div class="mt-2 flex flex-col items-center justify-center">
            <div class="bg-slate-600 mt-2 p-3 rounded-md">
                <h2 class="text-md font-bold">A manutenção já foi realiza e o serviço pago.</h2>
                <h3 class="text-md font-bold">Tem certeza que deseja finalizar a manutenção</h3>
            </div>

            <div class="mt-4 flex justify-between gap-8">
                <button (click)="closeModal()" class="rounded border border-none p-2 bg-gray-200 text-black hover:cursor-pointer hover:border-gray-800">
                    Cancelar
                </button>
                <button (click)="finishMaintenance()" class="rounded border border-none p-2 bg-green-600 text-white hover:cursor-pointer hover:border-gray-800">Finalizar e entregar</button>
            </div>
        </div>
    </div>
</div>
}
