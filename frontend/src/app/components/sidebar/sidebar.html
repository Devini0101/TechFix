<aside
  [class]="isCollapsed ? 'w-20 px-2' : 'w-64 px-4'"
  class="flex flex-col h-screen py-8 overflow-y-auto bg-gray-900 border-r dark:border-gray-700 transition-all duration-300"
>
    <!-- Cabeçalho -->
    <div class="flex items-center" [class]="isCollapsed ? 'justify-center' : 'justify-between px-2'">
        @if (!isCollapsed) {
          <h2 class="text-2xl font-bold text-white">TechFix</h2>
        }
        <button (click)="toggleSidebar()" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800 transition-colors">
            <i class="fa-solid fa-bars text-xl"></i>
        </button>
    </div>

    <!-- Lista de Links -->
    <div class="menu-list flex flex-col justify-between flex-1 mt-6">
        <nav class="space-y-2">
            <a routerLink="/dashboard" routerLinkActive="bg-gray-800 text-white" 
               class="flex items-center p-3 text-gray-400 hover:bg-gray-800 hover:text-gray-100 rounded-lg transition-colors" 
               [class.justify-center]="isCollapsed"
               [class.gap-3]="!isCollapsed">
                <i class="fas fa-home text-lg w-6 text-center"></i>
                @if (!isCollapsed) {
                  <span class="font-medium">Dashboard</span>
                }
            </a>

            <a routerLink="/requests"
               class="flex items-center p-3 text-gray-400 hover:bg-gray-800 hover:text-gray-100 rounded-lg transition-colors" 
               [class.justify-center]="isCollapsed"
               [class.gap-3]="!isCollapsed">
                <i class="fas fa-tasks text-lg w-6 text-center"></i>
                @if (!isCollapsed) {
                  <span class="font-medium">Solicitações</span>
                }
            </a>

            <a routerLink="/budgets" 
               class="flex items-center p-3 text-gray-400 hover:bg-gray-800 hover:text-gray-100 rounded-lg transition-colors" 
               [class.justify-center]="isCollapsed"
               [class.gap-3]="!isCollapsed">
                <i class="fa-solid fa-money-bills text-lg w-6 text-center"></i>
                @if (!isCollapsed) {
                  <span class="font-medium">Orçamentos</span>
                }
            </a>

            <a routerLink="/clients" 
               class="flex items-center p-3 text-gray-400 hover:bg-gray-800 hover:text-gray-100 rounded-lg transition-colors" 
               [class.justify-center]="isCollapsed"
               [class.gap-3]="!isCollapsed">
                <i class="fas fa-users text-lg w-6 text-center"></i>
                @if (!isCollapsed) {
                  <span class="font-medium">Clientes</span>
                }
            </a>

            <a routerLink="/categories" 
               class="flex items-center p-3 text-gray-400 hover:bg-gray-800 hover:text-gray-100 rounded-lg transition-colors" 
               [class.justify-center]="isCollapsed"
               [class.gap-3]="!isCollapsed">
                <i class="fas fa-tags text-lg w-6 text-center"></i>
                @if (!isCollapsed) {
                  <span class="font-medium">Categorias</span>
                }
            </a>

        </nav>

        <!-- Menu Inferior -->
        <div class="flex flex-col border-t border-gray-700 pt-4 space-y-2">
            <a routerLink="/settings" 
               class="flex items-center p-3 text-gray-400 hover:bg-gray-800 hover:text-gray-100 rounded-lg transition-colors" 
               [class.justify-center]="isCollapsed"
               [class.gap-3]="!isCollapsed">
                <i class="fas fa-cog text-lg w-6 text-center"></i>
                @if (!isCollapsed) {
                  <span class="font-medium">Configurações</span>
                }
            </a>

            <a (click)="logout()" 
               class="flex items-center p-3 text-red-400 hover:bg-gray-800 hover:text-red-300 rounded-lg transition-colors cursor-pointer" 
               [class.justify-center]="isCollapsed"
               [class.gap-3]="!isCollapsed">
                <i class="fas fa-sign-out-alt text-lg w-6 text-center"></i>
                @if (!isCollapsed) {
                  <span class="font-medium">Sair</span>
                }
            </a>
        </div>
    </div>
</aside>
