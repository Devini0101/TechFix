<main
    class="grid place-items-center py-12 px-4 font-sans relative overflow-hidden"
    aria-labelledby="not-found-title"
>

    <section class="relative z-10 w-full max-w-3xl text-center">
        <div class="flex justify-center mb-6">
            <div
                class="flex items-center justify-center w-24 h-24
                       bg-slate-900 border border-slate-700 rounded-3xl
                       shadow-2xl shadow-blue-950/40
                       rotate-6 hover:rotate-0 transition-transform duration-500"
            >
                <i
                    class="fa-solid fa-plug-circle-xmark text-5xl text-blue-500"
                    aria-hidden="true"
                ></i>
            </div>
        </div>

        <p
            class="text-8xl sm:text-9xl font-black tracking-tighter
                   text-transparent bg-clip-text
                   bg-gradient-to-r from-blue-500 to-cyan-300"
            aria-hidden="true"
        >
            404
        </p>

        <h1
            id="not-found-title"
            class="mt-4 text-3xl sm:text-5xl font-bold tracking-tight text-white"
        >
            Página não encontrada
        </h1>

        <p
            class="mt-5 mx-auto max-w-xl text-base sm:text-lg
                   leading-relaxed text-slate-400"
        >
            Não conseguimos localizar a página que você tentou acessar.
            Ela pode ter sido removida, alterada ou o endereço pode estar
            incorreto.
        </p>


        <div class="mt-8 flex flex-col items-center gap-3">
            <button
                type="button"
                routerLink="/dashboard"
                class="group inline-flex items-center justify-center gap-3
                       rounded-xl bg-blue-600 px-6 py-3
                       text-sm font-semibold text-white
                       transition-all hover:bg-blue-500
                       focus-visible:outline focus-visible:outline-2
                       focus-visible:outline-offset-2
                       focus-visible:outline-blue-500
                       hover:cursor-pointer"
            >
                <i
                    class="fa-solid fa-arrow-left transition-transform
                           group-hover:-translate-x-1"
                    aria-hidden="true"
                ></i>

                Voltar para o painel
            </button>
        </div>
    </section>
</main>
